name: Build debug APK

# Every build carries a higher versionCode and (when the update key secrets are set) the
# same signature, so installing a newer APK updates the app in place instead of forcing an
# uninstall that wipes the library.

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The shelf's PBR materials are compiled here, with Filament's own matc, and shipped as
      # bytes in the APK. Compiling them on the phone was the flaw: a material that fails to
      # compile there takes the whole scene with it, and the device has no way to tell anyone
      # which line it choked on. matc fails the build instead.
      - name: Compile the shelf materials
        run: ./tools/compile-materials.sh 2>&1 | tee material-compile.log

      # The runner's log lives on a host that cannot always be reached from where this is
      # debugged, so the compiler's own words are posted as a commit comment as well.
      - name: Report a material that would not compile
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "The shelf's materials did not compile, so the shelf would not have started."
            echo '```'
            tail -n 60 material-compile.log 2>/dev/null || echo "no compiler output captured"
            echo '```'
          } > material-failure.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -F body=@material-failure.md >/dev/null 2>&1 || true
          echo "::error title=Materials failed::See the commit comment for matc's output."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3"

      # Restores the one key that stays the same across builds. Without it, each runner
      # generates a fresh debug key, Android sees a different signer, and refuses the
      # update ("App not installed").
      - name: Configure update signing key
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          if [ -n "$LORE_KEYSTORE_BASE64" ] && [ -n "$LORE_KEYSTORE_PASSWORD" ] \
             && [ -n "$LORE_KEY_ALIAS" ] && [ -n "$LORE_KEY_PASSWORD" ]; then
            echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update.keystore"
            {
              echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update.keystore"
              echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
              echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
              echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Update key configured: this APK will install over the previous build."
          else
            echo "::warning title=No update signing key::LORE_KEYSTORE_BASE64 secrets are not set, so this APK is signed with a throwaway key. Installing it over an existing Lore build will fail with a signature mismatch and require an uninstall. Run tools/make-update-key.sh once to fix this."
          fi

      - name: Run unit tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > gradle-tests.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo "Gradle unit test run failed."
              echo '```'
              grep -E "app/src.*\.kt|\.kts:.*error|^e: |error:|What went wrong|Caused by|Exception|Detail:|requires|minCompileSdk|Dependency|FAILED|AssertionError|expected:|but was:" gradle-tests.log | head -n 70
              echo '```'
              # The JUnit XML carries the assertion text that the log only name-checks.
              if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
                echo "Failing assertions:"
                echo '```'
                grep -h -A4 "<failure" app/build/test-results/testDebugUnitTest/*.xml \
                  | sed -E 's/<[^>]+>//g' | grep -v '^[[:space:]]*$' | head -n 60
                echo '```'
              fi
              echo "Last 30 lines:"
              echo '```'
              tail -n 30 gradle-tests.log
              echo '```'
            } > test-failure.md
            head -c 60000 test-failure.md > test-failure.trimmed.md
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@test-failure.trimmed.md >/dev/null 2>&1 || true
            echo "::error title=Unit tests failed::See the build-failure commit comment for the compiler output."
          fi
          tail -n 40 gradle-tests.log
          exit "$code"

      - name: Build debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          # Monotonic across runs: a newer build always has a higher versionCode.
          LORE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle-build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            # Actions log blobs are not always reachable from every client, so the useful
            # part of the log is also posted as a commit comment where it can be read back.
            {
              echo "Gradle build failed."
              echo '```'
              grep -E "app/src.*\.kt|\.kts:.*error|^e: |error:|What went wrong|Caused by|Exception|Detail:|requires|minCompileSdk|Dependency" gradle-build.log | head -n 70
              echo '```'
              echo "Last 30 lines:"
              echo '```'
              tail -n 30 gradle-build.log
              echo '```'
            } > build-failure.md
            head -c 60000 build-failure.md > build-failure.trimmed.md
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -F body=@build-failure.trimmed.md >/dev/null 2>&1 || true
            echo "::error title=APK build failed::See the build-failure commit comment for the compiler output."
          fi
          tail -n 40 gradle-build.log
          exit "$code"

      - name: Rename APK
        run: |
          src="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          mv "$src" app/build/outputs/apk/debug/lore-debug.apk

      - name: Report APK identity
        run: |
          apk=app/build/outputs/apk/debug/lore-debug.apk
          info="$("$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging "$apk" | head -1)"
          echo "::notice title=APK built::$info"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$apk" \
            | head -3 | tr '\n' '|' | xargs -I{} echo "::notice title=APK signer::{}"

      # The shelf draws with Filament, which is a native engine: the JNI libraries must be in
      # the APK or the first engine call dies with UnsatisfiedLinkError. This checks both are
      # present for the ABI the phone actually runs, and reports the ABI split so a silently
      # missing arm64 slice is visible rather than suspected.
      - name: Check the APK ships Filament's native libraries
        run: |
          apk=app/build/outputs/apk/debug/lore-debug.apk
          echo "Native libraries in $apk:"
          unzip -l "$apk" | grep -E '\.so$' | awk '{print $4}' | sort || echo "(none)"
          missing=0
          for lib in libfilament-jni.so libfilamat-jni.so; do
            if unzip -l "$apk" | grep -qE "lib/(arm64-v8a|armeabi-v7a|x86_64)/$lib"; then
              echo "OK: $lib is packaged"
            else
              echo "::error title=Missing engine library::$lib is not in the APK, so the shelf cannot start."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lore-debug
          path: app/build/outputs/apk/debug/lore-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lore-unit-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
