name: Startup smoke test (release APK on an emulator)

# Why this exists.
#
# Round 8.1 shipped a release APK that dies about a second after launch, and CI stayed green. The
# reason CI stayed green is not subtle: every check in build-apk.yml compiles, runs JVM unit tests,
# reads the DEX back, and verifies a signature. **Nothing ever launched the app.** A crash that only
# happens on a device — an exception on the startup coroutine, an R8-renamed member, an asset or a
# library that is missing at run time — is invisible to all of it.
#
# So this workflow does the one thing the build workflow cannot: it boots an Android runtime,
# installs the *release* APK, launches it, and watches whether the process is still alive a few
# seconds later. If it is not, it prints the retraced crash and fails.
#
# It also prints the two things the build workflow used to throw away, both as run annotations that
# are readable from the run page without downloading an artifact:
#
#   * the SHA-256 and size of the release mapping.txt for this commit, so a reported trace can be
#     matched to the exact build it came from, and
#   * the retraced reported frames themselves, using that mapping.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform, build tools and emulator
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "emulator" \
            "system-images;android-34;google_apis;x86_64"

      - name: Restore the persistent signing key
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update.keystore"
          {
            echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update.keystore"
            echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
            echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
            echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The emulator image is x86_64; the app ships arm64-v8a and armeabi-v7a only, so there is no
      # native code to load on this runtime at all. That is deliberate: it makes the run a test of
      # the Dex the phone actually executes. It also means this step must not be mistaken for a test
      # of the PDF renderer, which needs a real CPU.
      - name: Build the release APK the phone gets
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          LORE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -40
          ls -l app/build/outputs/apk/release/
          sha256sum app/build/outputs/mapping/release/mapping.txt
          wc -c app/build/outputs/mapping/release/mapping.txt

      - name: Retrace the reported trace with THIS build's mapping
        run: |
          set +e
          mapping=app/build/outputs/mapping/release/mapping.txt
          python3 tools/retrace.py "$mapping" tools/reported-crash-276.txt > retraced.txt 2>&1
          echo "----- retraced (reported trace) -----"
          cat retraced.txt
          echo "----- reverse mapping for the reported classes -----"
          python3 tools/retrace.py "$mapping" --dump J.j J.k w2.A4 w2.m3 w2.F4 o3.g > dump.txt 2>&1
          cat dump.txt
          # Run annotations are readable from the run page without any artifact download.
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import urllib.parse, pathlib
          for name, path in (("Retraced reported trace", "retraced.txt"),
                             ("Reverse mapping", "dump.txt")):
              text = pathlib.Path(path).read_text()[:7000]
              print(f"### {name}\n```\n{text}\n```\n")
          PY

      - name: Boot the emulator
        run: |
          echo "no" | avdmanager create avd -n lore -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd lore -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -wipe-data > emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              echo "booted after ${i}0s"; break
            fi
            sleep 10
          done
          adb shell getprop sys.boot_completed
          adb shell wm size

      - name: Install the release APK and launch it
        run: |
          set +e
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          adb install -r "$apk" || adb install "$apk"
          "$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging "$apk" | head -1
          adb shell pm list packages | grep lantern
          adb logcat -c
          adb shell am start -W -n com.lantern.library/.MainActivity
          # The report says "approximately one second". Wait much longer than that, so a slow
          # emulator cannot be mistaken for a healthy app.
          sleep 25
          pid="$(adb shell pidof com.lantern.library | tr -d '\r')"
          echo "pid after 25s: '$pid'"
          if [ -z "$pid" ]; then
            echo "::error title=Startup crash::com.lantern.library is not running 25s after launch. The process died."
          else
            echo "::notice title=Startup::com.lantern.library is still running (pid $pid) 25s after launch."
          fi
          echo "----- crash buffer -----"
          adb logcat -d -b crash > crash.log 2>&1
          cat crash.log
          echo "----- app log -----"
          adb logcat -d | grep -E "lantern|AndroidRuntime|FATAL" > app.log 2>&1
          tail -80 app.log
          echo "----- main thread traces if still alive -----"
          adb shell dumpsys activity processes | grep -i "lantern" | head -5

      - name: Retrace whatever the device actually threw
        run: |
          set +e
          mapping=app/build/outputs/mapping/release/mapping.txt
          python3 tools/retrace.py "$mapping" crash.log > crash-retraced.txt 2>&1
          cat crash-retraced.txt
          python3 tools/retrace.py "$mapping" app.log > app-retraced.txt 2>&1
          grep -A12 -E "^Caused by|^FATAL|Exception" app-retraced.txt | head -60
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pathlib
          text = pathlib.Path("crash-retraced.txt").read_text()[:7000]
          print(f"### Crash buffer, retraced\n```\n{text}\n```\n")
          PY

      - name: Startup must be alive to pass
        run: |
          pid="$(adb shell pidof com.lantern.library | tr -d '\r')"
          echo "pid: $pid"
          test -n "$pid"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logs
          path: |
            crash.log
            app.log
            crash-retraced.txt
            app-retraced.txt
            retraced.txt
            dump.txt
            emulator.log
          if-no-files-found: ignore

      - name: Upload mapping.txt for this exact build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
