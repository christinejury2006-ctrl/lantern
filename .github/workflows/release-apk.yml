name: Release APK

# Tag a commit to publish a downloadable APK that installs over the previous release.
#   git tag v3.5.1 && git push origin v3.5.1

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3"

      - name: Configure update signing key
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          if [ -z "$LORE_KEYSTORE_BASE64" ]; then
            echo "::error title=Release needs an update key::Set LORE_KEYSTORE_BASE64, LORE_KEYSTORE_PASSWORD, LORE_KEY_ALIAS and LORE_KEY_PASSWORD before tagging a release, otherwise users must uninstall to update."
            exit 1
          fi
          echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update.keystore"
          {
            echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update.keystore"
            echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
            echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
            echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          LORE_VERSION_CODE: ${{ format('{0}{1}', 100, github.run_number) }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK after the tag
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          src="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          mkdir -p out
          cp "$src" "out/lore-$tag.apk"
          echo "APK=out/lore-$tag.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME:-manual}"
          gh release create "$tag" "$APK" \
            --title "Lore $tag" \
            --notes "Install straight over the previous version — your library, progress and settings are kept." \
            --latest
