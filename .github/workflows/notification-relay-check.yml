name: Check Spark notification relay

on:
  push:
    branches: ["**"]
    paths:
      - "workers/notification-relay/**"
      - ".github/workflows/notification-relay-check.yml"
  pull_request:
    paths:
      - "workers/notification-relay/**"
      - ".github/workflows/notification-relay-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/notification-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
