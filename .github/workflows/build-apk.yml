name: Build debug APK

# A single persistent signing key is required so newer APKs update in place.
# Do not silently fall back to a throwaway runner debug key.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"
      - "L'Oréal"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Require persistent update signing key
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in LORE_KEYSTORE_BASE64 LORE_KEYSTORE_PASSWORD LORE_KEY_ALIAS LORE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing signing secret::$name is not set. Configure the four LORE_KEYSTORE_* GitHub Actions secrets before building an installable APK."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Refusing to generate an ephemeral signing key. It would change the APK fingerprint on the next build."
            exit 1
          fi
          echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update.keystore"
          {
            echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update.keystore"
            echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
            echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
            echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Persistent Lore update key configured."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3"

      - name: Run unit tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace > unit.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            # A green tick is not evidence that the new tests ran; this is. GitHub's artifact
            # storage is not always reachable, so the count is printed on the run itself.
            results=app/build/test-results/testDebugUnitTest
            if [ -d "$results" ]; then
              summary=$(grep -ho 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$results"/*.xml \
                | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {printf "tests=%d skipped=%d failures=%d errors=%d", t, s, f, e}')
              echo "::notice title=Unit tests::$summary"
              classes=""
              for f in "$results"/*.xml; do
                name=$(grep -o 'name="[^"]*"' "$f" | head -1 | cut -d'"' -f2)
                counts=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | cut -d'"' -f2)
                classes="$classes$name=$counts "
              done
              # Also an annotation: run logs are not always readable from here, and "did my new
              # test class actually run?" should be answerable from the run page alone.
              echo "::notice title=Unit test classes::${classes% }"
            fi
          fi
          if [ "$status" -ne 0 ]; then
            echo "----- compiler errors -----"
            grep -E '^e: ' unit.log | head -15
            echo "----- test failures -----"
            grep -E '(FAILED|AssertionError|ComparisonFailure|expected:)' unit.log | head -20
            compile=$(grep -E '^e: ' unit.log | head -8 | tr '\n' '|' | cut -c1-900)
            tests=$(grep -E 'FAILED|AssertionError' unit.log | head -6 | tr '\n' '|' | cut -c1-900)
            [ -n "$compile" ] && echo "::error title=Kotlin compile errors::$compile"
            [ -n "$tests" ] && echo "::error title=Failing unit tests::$tests"
          fi
          exit $status

      - name: Build debug APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          LORE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > debug-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -E '^e: ' debug-build.log | head -15
            compile=$(grep -E '^e: ' debug-build.log | head -8 | tr '\n' '|' | cut -c1-900)
            [ -n "$compile" ] && echo "::error title=Debug build compile errors::$compile"
          fi
          exit $status

      - name: Rename APK
        run: |
          src="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          mv "$src" app/build/outputs/apk/debug/lore-debug.apk

      - name: Report APK identity
        run: |
          apk=app/build/outputs/apk/debug/lore-debug.apk
          info="$("$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging "$apk" | head -1)"
          echo "::notice title=APK built::$info"
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$apk" | head -3

      - name: Report Google Sign-In configuration
        run: |
          file=app/google-services.json
          if [ -f "$file" ]; then
            android=$(jq '[.client[].oauth_client[]? | select(.client_type == 1)] | length' "$file")
            web=$(jq '[.client[].oauth_client[]? | select(.client_type == 3)] | length' "$file")
            web_id=$(jq -r '([.client[].oauth_client[]? | select(.client_type == 3)][0].client_id) // "-"' "$file")
          else
            android=0; web=0; web_id="-"
          fi
          echo "::notice title=OAuth clients in google-services.json::android=$android web=$web"
          echo "::notice title=Web OAuth client id in the build::$web_id"
          if [ "$android" -eq 0 ]; then
            echo "::warning title=Google Sign-In configuration::No Android OAuth client in google-services.json. Register this APK signer's SHA-1 in Firebase and download the updated file."
          fi
          if [ "$web" -eq 0 ]; then
            echo "::warning title=Google Sign-In configuration::No Web OAuth client in google-services.json."
          fi

      - name: Check the APK ships the PDF engine
        run: |
          apk=app/build/outputs/apk/debug/lore-debug.apk
          unzip -l "$apk" | grep -E '\.so$' | awk '{print $4}' | sort || true
          if unzip -l "$apk" | grep -qiE 'lib/(arm64-v8a|armeabi-v7a)/[^/]*pdfium[^/]*\.so$'; then
            echo "OK: pdfium is packaged"
          else
            echo "::error title=Missing PDF engine::no pdfium library is in the APK."
            exit 1
          fi

      - name: Build the minified release APK and check R8 kept the native bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          LORE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "release APK: $apk ($(du -h "$apk" | cut -f1))"
          rm -rf dexcheck && mkdir -p dexcheck
          unzip -o -q "$apk" 'classes*.dex' -d dexcheck
          dexdump="$ANDROID_HOME/build-tools/34.0.0/dexdump"
          dump=dexcheck/dump.txt
          : > "$dump"
          for dex in dexcheck/classes*.dex; do "$dexdump" -f "$dex" >> "$dump" 2>/dev/null; done
          missing=0
          for cls in com/shockwave/pdfium/PdfiumCore com/shockwave/pdfium/PdfDocument com/google/firebase/auth/FirebaseAuth com/google/firebase/firestore/FirebaseFirestore; do
            if grep -q "L$cls;" "$dump"; then echo "OK: $cls kept its name"; else echo "::error title=R8 stripped required class::$cls"; missing=$((missing + 1)); fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      # Printing the signer was not enough: the log is the one place nobody looks, and a build
      # signed by the wrong key installs over nothing — Android refuses it with a signature
      # mismatch, and Google Sign-In refuses the fingerprint. So the identity is asserted, for
      # both APKs, against the certificate this repository expects. Override it with the
      # repository variable LORE_EXPECTED_SIGNER_SHA1 if the key is ever rotated.
      - name: Verify both APKs carry the persistent signing key
        env:
          EXPECTED_SHA1: ${{ vars.LORE_EXPECTED_SIGNER_SHA1 || '6fdf2aded560460dc2ededd1a25ba8f5c76abe3c' }}
        run: |
          expected=$(printf '%s' "$EXPECTED_SHA1" | tr -d ':' | tr 'A-F' 'a-f')
          status=0
          # Globbed, not named: Gradle's output file name is its business, and a rename here
          # would turn this check into a no-op that always passes.
          for apk in app/build/outputs/apk/debug/lore-debug.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            actual=$("$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
            echo "$apk signer SHA-1: $actual"
            echo "::notice title=$(basename "$apk") signer SHA-1::$actual"
            if [ -z "$actual" ]; then
              echo "::error title=Unsigned APK::$apk carries no signing certificate."
              status=1
            elif [ -n "$expected" ] && [ "$actual" != "$expected" ]; then
              echo "::error title=Wrong signing key::$apk is signed by $actual, not $expected. It will not install over an existing Lore, and Google Sign-In will reject it."
              status=1
            fi
          done
          exit $status

      - name: Upload the minified release APK
        uses: actions/upload-artifact@v4
        with:
          name: Lore-release-minified
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lore-debug
          path: app/build/outputs/apk/debug/lore-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lore-unit-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
