name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/glass-reader-upgrades

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "build-tools;30.0.3"

      - name: Configure stable update signing key (optional)
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          if [ -n "$LORE_KEYSTORE_BASE64" ] && [ -n "$LORE_KEYSTORE_PASSWORD" ] && [ -n "$LORE_KEY_ALIAS" ] && [ -n "$LORE_KEY_PASSWORD" ]; then
            echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update-key.jks"
            {
              echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update-key.jks"
              echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
              echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
              echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Stable signing key configured."
          else
            echo "Stable signing key secrets are not configured; this APK will use the runner's default debug key and may not update an existing install."
          fi

      - name: Build debug APK
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          src="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          mv "$src" app/build/outputs/apk/debug/lore-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Lore-debug
          path: app/build/outputs/apk/debug/lore-debug.apk
          if-no-files-found: error
