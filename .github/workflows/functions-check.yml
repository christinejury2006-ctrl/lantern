name: Check notification functions

on:
  push:
    branches: ["**"]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
