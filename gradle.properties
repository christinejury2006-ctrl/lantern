# The Kotlin compiler runs in-process, so it shares this heap. AGP 8 + Kotlin 1.9 with the
# Compose plugin needs real headroom: at 768m/256m the build died with
# "OutOfMemoryError: Metaspace" while compiling AppRoot.kt.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=35
