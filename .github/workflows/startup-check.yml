name: Startup smoke test (release APK on an emulator)

# Why this exists.
#
# Round 8.1 shipped a release APK that dies about a second after launch, and CI stayed green. The
# reason is not subtle: every check in build-apk.yml compiles, runs JVM unit tests, reads the DEX
# back and verifies a signature. **Nothing ever launched the app.** A crash that only happens on a
# device - an exception on the startup coroutine, an R8-renamed member, a resource that is missing at
# run time - is invisible to all of it.
#
# So this workflow does the one thing the build workflow cannot: it boots an Android runtime,
# installs the *release* APK, launches it, and checks whether the process is still alive well past
# the one second the report mentions. If it is not, it retraces the crash with that build's own
# mapping.txt and fails.
#
# The retrace step runs before the emulator so its output is available even when the emulator is
# slow: everything important is emitted as a run annotation (readable from the run page) rather than
# only as an artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/**"

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Restore the persistent signing key
        env:
          LORE_KEYSTORE_BASE64: ${{ secrets.LORE_KEYSTORE_BASE64 }}
          LORE_KEYSTORE_PASSWORD: ${{ secrets.LORE_KEYSTORE_PASSWORD }}
          LORE_KEY_ALIAS: ${{ secrets.LORE_KEY_ALIAS }}
          LORE_KEY_PASSWORD: ${{ secrets.LORE_KEY_PASSWORD }}
        run: |
          echo "$LORE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lore-update.keystore"
          {
            echo "LORE_KEYSTORE_PATH=$RUNNER_TEMP/lore-update.keystore"
            echo "LORE_KEYSTORE_PASSWORD=$LORE_KEYSTORE_PASSWORD"
            echo "LORE_KEY_ALIAS=$LORE_KEY_ALIAS"
            echo "LORE_KEY_PASSWORD=$LORE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build the release APK the phone gets
        timeout-minutes: 25
        env:
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          FIREBASE_WEB_CLIENT_ID: ${{ secrets.FIREBASE_WEB_CLIENT_ID }}
          LORE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -30
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "release APK: $apk"
          "$ANDROID_HOME"/build-tools/34.0.0/aapt dump badging "$apk" | head -1
          mapping=app/build/outputs/mapping/release/mapping.txt
          {
            echo "MAPPING_SHA256=$(sha256sum "$mapping" | cut -d' ' -f1)"
            echo "MAPPING_BYTES=$(wc -c < "$mapping")"
          } | tee mapping-id.txt
          cat mapping-id.txt

      # Everything below is printed *and* annotated: the run page is the only output channel that
      # works in every environment, and the point of this workflow is to make the mapping readable.
      - name: Retrace the reported trace with THIS build's mapping
        run: |
          set +e
          mapping=app/build/outputs/mapping/release/mapping.txt
          python3 tools/retrace.py "$mapping" tools/reported-crash-276.txt > retraced.txt 2>&1
          python3 tools/retrace.py "$mapping" --dump J.j J.k w2.A4 w2.m3 w2.F4 o3.g > dump.txt 2>&1
          echo "----- retraced -----"; cat retraced.txt
          echo "----- reverse mapping -----"; cat dump.txt
          python3 tools/annotate.py notice "Mapping identity" mapping-id.txt
          python3 tools/annotate.py notice "Reported trace, retraced with this build's mapping" retraced.txt
          python3 tools/annotate.py notice "Reverse mapping for reported classes" dump.txt
          {
            echo "### Mapping identity"; echo '```'; cat mapping-id.txt; echo '```'
            echo "### Reported trace, retraced"; echo '```'; cat retraced.txt; echo '```'
            echo "### Reverse mapping"; echo '```'; cat dump.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Launch the release APK on an Android 34 emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: |
            set +e
            apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
            adb install -r "$apk" || adb install "$apk"
            adb shell pm list packages | grep lantern
            adb logcat -c
            adb shell am start -W -n com.lantern.library/.MainActivity
            # The report says "approximately one second". This waits far longer, so a slow emulator
            # cannot be mistaken for a healthy app.
            sleep 30
            pid="$(adb shell pidof com.lantern.library | tr -d '\r')"
            echo "pid after 30s: '$pid'"
            adb logcat -d -b crash > crash.log 2>&1
            adb logcat -d > app.log 2>&1
            echo "----- crash buffer -----"; cat crash.log
            echo "----- app log (filtered) -----"
            grep -E "lantern|AndroidRuntime|FATAL|LoreStartup" app.log | tail -120
            # The verdict is written to a file as well as to the log: the emulator is shut down when
            # this script returns, so a later step cannot ask `adb` whether the process is alive.
            if [ -z "$pid" ]; then
              echo "DEAD" > startup-result.txt
              echo "::error title=Startup crash::com.lantern.library is not running 30s after launch: the process died."
            else
              echo "ALIVE $pid" > startup-result.txt
              echo "::notice title=Startup survived::com.lantern.library is still running (pid $pid) 30s after launch."
            fi
            exit 0

      - name: Retrace whatever the device actually threw
        if: always()
        run: |
          set +e
          mapping=app/build/outputs/mapping/release/mapping.txt
          [ -f crash.log ] || : > crash.log
          [ -f app.log ] || : > app.log
          python3 tools/retrace.py "$mapping" crash.log > crash-retraced.txt 2>&1
          python3 tools/retrace.py "$mapping" app.log > app-retraced.txt 2>&1
          grep -B2 -A14 -E "FATAL|Caused by|Exception" crash-retraced.txt | head -80
          python3 tools/annotate.py notice "Device crash buffer, retraced" crash-retraced.txt
          {
            echo "### Device crash buffer, retraced"; echo '```'
            head -60 crash-retraced.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate. `if: always()` so a failure earlier in the job still reports the verdict, and the
      # step fails when the app did not survive.
      - name: Startup must be alive to pass
        if: always()
        run: |
          echo "startup-result.txt: $(cat startup-result.txt 2>/dev/null)"
          grep -q '^ALIVE' startup-result.txt

      - name: Upload logs and mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-logs
          path: |
            crash.log
            app.log
            crash-retraced.txt
            app-retraced.txt
            retraced.txt
            dump.txt
            mapping-id.txt
            app/build/outputs/mapping/release/mapping.txt
            startup-result.txt
          if-no-files-found: ignore
